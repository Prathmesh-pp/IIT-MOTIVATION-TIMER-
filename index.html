<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>JEE 2027 COMEBACK</title>

<!-- GOOGLE FONTS -->

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* BODY */

body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:35px;

    overflow-x:hidden;
    overflow-y:auto;

    font-family:'Poppins',sans-serif;

    background:url('3.jpg') no-repeat center center/cover;

    color:white;

    position:relative;
}

/* DARK OVERLAY */

body::before{

    content:"";

    position:fixed;

    inset:0;

    background:
    linear-gradient(
    135deg,
    rgba(0,0,0,0.9),
    rgba(0,0,0,0.65),
    rgba(0,0,0,0.9));

    backdrop-filter:blur(4px);

    z-index:-2;
}

/* BACKGROUND GLOW */

body::after{

    content:"";

    position:fixed;

    width:700px;
    height:700px;

    background:
    radial-gradient(circle,
    rgba(255,120,0,0.18),
    transparent 70%);

    top:-250px;
    right:-150px;

    animation:glowMove 6s ease-in-out infinite alternate;

    z-index:-1;
}

@keyframes glowMove{

    from{
        transform:translateY(0px);
    }

    to{
        transform:translateY(50px);
    }
}

/* MAIN CONTAINER */

.container{

    width:100%;

    max-width:1300px;

    padding:45px;

    border-radius:35px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:60px;

    background:rgba(255,255,255,0.05);

    backdrop-filter:blur(16px);

    border:2px solid transparent;

    background-image:
    linear-gradient(rgba(15,15,15,0.92),
    rgba(15,15,15,0.88)),
    linear-gradient(135deg,#ff6600,#ffcc00,#ff0066);

    background-origin:border-box;
    background-clip:padding-box,border-box;

    box-shadow:
    0 0 30px rgba(255,120,0,0.25),
    0 0 80px rgba(255,0,80,0.08);

    animation:containerGlow 4s infinite alternate;
}

@keyframes containerGlow{

    from{

        box-shadow:
        0 0 20px rgba(255,120,0,0.2),
        0 0 50px rgba(255,0,80,0.05);
    }

    to{

        box-shadow:
        0 0 45px rgba(255,120,0,0.5),
        0 0 100px rgba(255,0,80,0.15);
    }
}

/* LEFT */

.left{

    width:35%;

    text-align:center;
}

/* PROFILE */

.profile{

    width:230px;
    height:230px;

    object-fit:cover;

    border-radius:50%;

    border:5px solid rgba(255,255,255,0.1);

    box-shadow:
    0 0 20px orange,
    0 0 50px rgba(255,120,0,0.5);

    animation:profilePulse 3s infinite alternate;
}

@keyframes profilePulse{

    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.04);
    }
}

/* NAME */

h1{

    margin-top:30px;

    font-family:'Orbitron',sans-serif;

    font-size:3rem;

    font-weight:900;

    line-height:1.3;

    text-transform:uppercase;

    text-shadow:
    0 0 10px orange,
    0 0 25px rgba(255,120,0,0.8);
}

/* TITLE */

h2{

    margin-top:18px;

    font-size:1.2rem;

    letter-spacing:3px;

    color:#ffcc00;

    text-shadow:0 0 12px rgba(255,200,0,0.8);
}

/* RIGHT */

.right{

    width:65%;
}

/* MOTIVATION BOX */

.motivation{

    padding:35px;

    border-radius:28px;

    background:rgba(255,255,255,0.04);

    border:1px solid rgba(255,255,255,0.08);

    line-height:2;

    font-size:1.2rem;

    font-weight:500;

    color:#f2f2f2;

    margin-bottom:35px;

    box-shadow:0 0 25px rgba(255,255,255,0.04);
}

/* HIGHLIGHT */

.highlight{

    color:#ff9900;

    font-weight:700;

    text-shadow:
    0 0 10px orange,
    0 0 25px rgba(255,120,0,0.7);
}

/* COUNTDOWN */

.countdown-container{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(140px,1fr));

    gap:20px;
}

/* TIME BOX */

.time-box{

    padding:25px 18px;

    border-radius:25px;

    background:rgba(255,255,255,0.05);

    border:1px solid rgba(255,255,255,0.08);

    text-align:center;

    transition:0.3s;

    backdrop-filter:blur(8px);

    box-shadow:0 0 20px rgba(255,120,0,0.05);
}

.time-box:hover{

    transform:translateY(-8px);

    box-shadow:
    0 0 25px rgba(255,120,0,0.35),
    0 0 60px rgba(255,120,0,0.1);
}

/* NUMBER */

.number{

    font-family:'Orbitron',sans-serif;

    font-size:2.8rem;

    font-weight:900;

    color:white;

    text-shadow:
    0 0 12px orange;
}

/* LABEL */

.label{

    margin-top:10px;

    font-size:0.95rem;

    letter-spacing:2px;

    color:#ffcc00;
}

/* COMEBACK */

.comeback{

    margin-top:35px;

    text-align:center;

    font-size:1.4rem;

    font-weight:700;

    letter-spacing:2px;

    text-shadow:
    0 0 10px orange,
    0 0 25px red;
}

/* FLOATING PARTICLES */

.particle{

    position:fixed;

    animation:float linear infinite;

    opacity:0.8;

    z-index:-1;
}

@keyframes float{

    from{
        transform:translateY(100vh) rotate(0deg);
    }

    to{
        transform:translateY(-120vh) rotate(360deg);
    }
}

/* FULLSCREEN BUTTON */

#fullscreen-btn{

    position:fixed;

    top:20px;
    right:20px;

    padding:14px 22px;

    border:none;

    border-radius:16px;

    background:
    linear-gradient(135deg,#ff6600,#ff0066);

    color:white;

    font-family:'Orbitron',sans-serif;

    font-weight:700;

    cursor:pointer;

    z-index:999;

    transition:0.3s;

    box-shadow:
    0 0 20px rgba(255,80,0,0.5);
}

#fullscreen-btn:hover{

    transform:scale(1.08);

    box-shadow:
    0 0 30px rgba(255,80,0,0.8),
    0 0 60px rgba(255,0,100,0.2);
}

/* MOBILE RESPONSIVE */

@media(max-width:1100px){

    .container{

        flex-direction:column;

        text-align:center;

        padding:35px;

        margin-top:40px;
        margin-bottom:40px;
    }

    .left,
    .right{

        width:100%;
    }

    h1{

        font-size:2.1rem;
    }

    h2{

        font-size:1rem;
    }

    .motivation{

        font-size:1rem;

        line-height:1.9;
    }

    .number{

        font-size:2.2rem;
    }

    .profile{

        width:180px;
        height:180px;
    }

    .countdown-container{

        grid-template-columns:
        repeat(2,1fr);
    }
}

@media(max-width:600px){

    .countdown-container{

        grid-template-columns:1fr;
    }

    .container{

        padding:25px;
    }

    .motivation{

        padding:25px;
    }
}

</style>

</head>

<body>

<!-- FLOATING PARTICLES -->

<div class="particle" style="left:5%; font-size:20px; animation-duration:7s;">✦</div>

<div class="particle" style="left:20%; font-size:25px; animation-duration:9s;">⚡</div>

<div class="particle" style="left:40%; font-size:18px; animation-duration:6s;">✦</div>

<div class="particle" style="left:60%; font-size:22px; animation-duration:10s;">🔥</div>

<div class="particle" style="left:80%; font-size:18px; animation-duration:8s;">⚡</div>

<div class="particle" style="left:92%; font-size:25px; animation-duration:11s;">✦</div>

<!-- MAIN CONTAINER -->

<div class="container">

    <!-- LEFT -->

    <div class="left">

        <img src="download (2).jfif" class="profile">

        <h1>
            PRATHMESH<br>
            PANCHAL
        </h1>

        <h2>
            IIT JEE 2027 ASPIRANT ⚡
        </h2>

    </div>

    <!-- RIGHT -->

    <div class="right">

        <div class="motivation">

            IT'S NOT THE END...<br><br>

            THIS IS THE
            <span class="highlight">
            REBIRTH OF A WARRIOR.
            </span><br><br>

            REBUILDING WITH:<br><br>

            🔥 FULL DISCIPLINE<br>
            🔥 FULL HARDWORK<br>
            🔥 FULL FOCUS<br><br>

            TARGET LOCKED:<br><br>

            <span class="highlight">
            IIT JEE 2027 🚀
            </span>

        </div>

        <!-- COUNTDOWN -->

        <div class="countdown-container">

            <div class="time-box">

                <div class="number" id="days">00</div>

                <div class="label">DAYS</div>

            </div>

            <div class="time-box">

                <div class="number" id="hours">00</div>

                <div class="label">HOURS</div>

            </div>

            <div class="time-box">

                <div class="number" id="minutes">00</div>

                <div class="label">MINUTES</div>

            </div>

            <div class="time-box">

                <div class="number" id="seconds">00</div>

                <div class="label">SECONDS</div>

            </div>

        </div>

        <div class="comeback">

            THE COMEBACK WILL BE LOUDER ⚡

        </div>

    </div>

</div>

<!-- FULLSCREEN BUTTON -->

<button id="fullscreen-btn" onclick="toggleFullscreen()">

    FULLSCREEN ⚡

</button>

<script>

/* COUNTDOWN */

const targetDate =
new Date("2027-01-22T00:00:00").getTime();

function updateCountdown(){

    const now = new Date().getTime();

    const distance = targetDate - now;

    if(distance < 0){

        document.body.innerHTML =
        "<h1 style='color:white;font-size:5rem;'>🔥 THE BATTLE HAS BEGUN 🔥</h1>";

        return;
    }

    const days =
    Math.floor(distance / (1000*60*60*24));

    const hours =
    Math.floor((distance % (1000*60*60*24))
    / (1000*60*60));

    const minutes =
    Math.floor((distance % (1000*60*60))
    / (1000*60));

    const seconds =
    Math.floor((distance % (1000*60))
    / 1000);

    document.getElementById("days").innerText = days;
    document.getElementById("hours").innerText = hours;
    document.getElementById("minutes").innerText = minutes;
    document.getElementById("seconds").innerText = seconds;
}

setInterval(updateCountdown,1000);

updateCountdown();

/* FULLSCREEN */

function toggleFullscreen(){

    if(!document.fullscreenElement){

        document.documentElement.requestFullscreen();

    }else{

        document.exitFullscreen();
    }
}

</script>

</body>

</html>
```
