<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PRATHMESH PANCHAL | IIT JEE 2027</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:35px;

    overflow-x:hidden;
    overflow-y:auto;

    background:
    linear-gradient(
    135deg,
    #0a0a0a,
    #111111,
    #1a0f00);

    font-family:'Poppins',sans-serif;

    color:white;

    position:relative;
}

/* BACKGROUND GLOW */

body::before{

    content:"";

    position:fixed;

    width:700px;
    height:700px;

    top:-250px;
    left:-150px;

    background:
    radial-gradient(circle,
    rgba(255,140,0,0.18),
    transparent 70%);

    animation:glowMove 7s ease-in-out infinite alternate;

    z-index:-2;
}

body::after{

    content:"";

    position:fixed;

    width:700px;
    height:700px;

    bottom:-300px;
    right:-150px;

    background:
    radial-gradient(circle,
    rgba(255,0,80,0.12),
    transparent 70%);

    animation:glowMove2 8s ease-in-out infinite alternate;

    z-index:-2;
}

@keyframes glowMove{

    from{
        transform:translateY(0px);
    }

    to{
        transform:translateY(50px);
    }
}

@keyframes glowMove2{

    from{
        transform:translateY(0px);
    }

    to{
        transform:translateY(-50px);
    }
}

/* MAIN CONTAINER */

.container{

    width:100%;

    max-width:1450px;

    padding:45px;

    border-radius:38px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:55px;

    background:
    linear-gradient(
    135deg,
    rgba(255,255,255,0.04),
    rgba(255,255,255,0.02));

    backdrop-filter:blur(18px);

    border:2px solid rgba(255,140,0,0.6);

    box-shadow:
    0 0 35px rgba(255,140,0,0.2),
    0 0 100px rgba(255,80,0,0.08);

    position:relative;
}

/* LEFT SIDE */

.left{

    width:33%;

    text-align:center;
}

/* PROFILE IMAGE */

.profile{

    width:240px;
    height:240px;

    border-radius:50%;

    object-fit:cover;

    border:5px solid rgba(255,170,0,0.8);

    box-shadow:
    0 0 25px orange,
    0 0 60px rgba(255,140,0,0.6);

    animation:profileGlow 3s infinite alternate;
}

@keyframes profileGlow{

    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.03);
    }
}

/* NAME */

h1{

    margin-top:32px;

    font-family:'Orbitron',sans-serif;

    font-size:3.4rem;

    font-weight:900;

    line-height:1.25;

    text-transform:uppercase;

    color:white;

    text-shadow:
    0 0 12px orange,
    0 0 30px rgba(255,140,0,0.8);
}

/* TITLE */

h2{

    margin-top:18px;

    font-size:1.2rem;

    letter-spacing:4px;

    color:#ffcc00;

    text-transform:uppercase;

    text-shadow:
    0 0 10px rgba(255,200,0,0.8);
}

/* RIGHT SIDE */

.right{

    width:67%;
}

/* MOTIVATION BOX */

.motivation{

    position:relative;

    padding:55px;

    border-radius:35px;

    background:
    linear-gradient(
    135deg,
    rgba(255,255,255,0.03),
    rgba(255,140,0,0.03));

    border:1px solid rgba(255,170,0,0.25);

    box-shadow:
    inset 0 0 20px rgba(255,140,0,0.05),
    0 0 40px rgba(255,140,0,0.08);

    overflow:hidden;
}

/* QUOTE SYMBOLS */

.quote-top{

    position:absolute;

    top:10px;
    left:8px;

    font-size:6rem;

    font-family:'Orbitron',sans-serif;

    color:#ff8800;

    text-shadow:
    0 0 20px orange;
}

.quote-bottom{

    position:absolute;

    right:30px;
    bottom:-25px;

    font-size:6rem;

    font-family:'Orbitron',sans-serif;

    color:#ff8800;

    text-shadow:
    0 0 20px orange;
}

/* QUOTE TEXT */

.quote-line{

    font-size:2rem;

    font-weight:700;

    line-height:1.45;

    letter-spacing:1px;

    text-transform:uppercase;

    margin-bottom:28px;

    color:#f5f5f5;
}

/* HIGHLIGHT */

.highlight{

    color:#ff9900;

    text-shadow:
    0 0 10px orange,
    0 0 25px rgba(255,140,0,0.8);
}

/* DIVIDER */

.divider{

    width:100%;

    height:1px;

    margin:25px 0;

    background:
    linear-gradient(
    to right,
    transparent,
    rgba(255,140,0,0.8),
    transparent);
}

/* TARGET */

.target-box{

    margin-top:45px;

    font-size:1.8rem;

    font-weight:700;

    letter-spacing:2px;

    text-transform:uppercase;
}

/* COUNTDOWN */

.countdown-container{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(160px,1fr));

    gap:22px;

    margin-top:35px;
}

/* TIME BOX */

.time-box{

    padding:28px 20px;

    border-radius:28px;

    text-align:center;

    background:
    linear-gradient(
    135deg,
    rgba(255,255,255,0.04),
    rgba(255,140,0,0.03));

    border:1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(10px);

    transition:0.3s;

    box-shadow:
    0 0 25px rgba(255,140,0,0.05);
}

.time-box:hover{

    transform:translateY(-8px);

    box-shadow:
    0 0 30px rgba(255,140,0,0.35),
    0 0 60px rgba(255,140,0,0.08);
}

/* NUMBERS */

.number{

    font-family:'Orbitron',sans-serif;

    font-size:3rem;

    font-weight:900;

    color:white;

    text-shadow:
    0 0 15px orange;
}

/* LABEL */

.label{

    margin-top:12px;

    font-size:1rem;

    letter-spacing:3px;

    color:#ffcc00;

    text-transform:uppercase;
}

/* FULLSCREEN BUTTON */

#fullscreen-btn{

    position:fixed;

    top:15px;
    right:15px;

    padding:16px 24px;

    border:none;

    border-radius:18px;

    background:
    linear-gradient(
    135deg,
    #ff6600,
    #ff0066);

    color:white;

    font-family:'Orbitron',sans-serif;

    font-size:0.95rem;

    font-weight:700;

    cursor:pointer;

    transition:0.3s;

    box-shadow:
    0 0 20px rgba(255,80,0,0.5);

    z-index:999;
}

#fullscreen-btn:hover{

    transform:scale(1.08);

    box-shadow:
    0 0 30px rgba(255,80,0,0.8),
    0 0 60px rgba(255,0,100,0.2);
}

/* PARTICLES */

.particle{

    position:fixed;

    z-index:-1;

    opacity:0.8;

    animation:float linear infinite;
}

@keyframes float{

    from{
        transform:translateY(100vh) rotate(0deg);
    }

    to{
        transform:translateY(-120vh) rotate(360deg);
    }
}

/* RESPONSIVE */

@media(max-width:1100px){

    .container{

        flex-direction:column;

        padding:35px;

        text-align:center;
    }

    .left,
    .right{

        width:100%;
    }

    h1{

        font-size:2.3rem;
    }

    .profile{

        width:180px;
        height:180px;
    }

    .quote-line{

        font-size:1.2rem;
    }

    .target-box{

        font-size:1.2rem;
    }

    .quote-top,
    .quote-bottom{

        font-size:4rem;
    }

    .countdown-container{

        grid-template-columns:
        repeat(2,1fr);
    }

    .number{

        font-size:2.2rem;
    }
}

@media(max-width:650px){

    .countdown-container{

        grid-template-columns:1fr;
    }

    .motivation{

        padding:35px 25px;
    }

    .container{

        padding:25px;
    }

    h1{

        font-size:1.8rem;
    }
}

</style>

</head>

<body>

<!-- PARTICLES -->

<div class="particle" style="left:8%; font-size:22px; animation-duration:7s;">✦</div>

<div class="particle" style="left:22%; font-size:18px; animation-duration:9s;">⚡</div>

<div class="particle" style="left:48%; font-size:24px; animation-duration:11s;">✦</div>

<div class="particle" style="left:72%; font-size:20px; animation-duration:8s;">🔥</div>

<div class="particle" style="left:90%; font-size:18px; animation-duration:10s;">⚡</div>

<!-- MAIN -->

<div class="container">

    <!-- LEFT -->

    <div class="left">

        <img src="download (2).jfif" class="profile">

        <h1>
            PRATHMESH<br>
            PANCHAL
        </h1>

        <h2>
            IIT JEE 2027 ASPIRANT ⚡
        </h2>

    </div>

    <!-- RIGHT -->

    <div class="right">

        <div class="motivation">

            <div class="quote-top">❝</div>

            <div class="quote-line">

                DISCIPLINE TODAY,<br>

                <span class="highlight">
                SUCCESS
                </span>

                TOMORROW.

            </div>

            <div class="divider"></div>

            <div class="quote-line">

                ONE YEAR OF SACRIFICE,<br>

                A LIFETIME OF

                <span class="highlight">
                FREEDOM.
                </span>

            </div>

            <div class="divider"></div>

            <div class="quote-line">

                I DON'T NEED MOTIVATION,<br>

                I NEED

                <span class="highlight">
                Discipline 🎯
                </span>

            </div>

            <div class="divider"></div>

            <div class="quote-line">

                EVERY DAY IS A STEP CLOSER<br>

                TO

                <span class="highlight">
                MY DREAM.
                </span>

            </div>

            <div class="target-box">

                🎯 TARGET:

                <span class="highlight">
                Under 500 Rank 🚀
                </span>

            </div>

            <div class="quote-bottom">❞</div>

        </div>

        <!-- COUNTDOWN -->

        <div class="countdown-container">

            <div class="time-box">

                <div class="number" id="days">00</div>

                <div class="label">DAYS</div>

            </div>

            <div class="time-box">

                <div class="number" id="hours">00</div>

                <div class="label">HOURS</div>

            </div>

            <div class="time-box">

                <div class="number" id="minutes">00</div>

                <div class="label">MINUTES</div>

            </div>

            <div class="time-box">

                <div class="number" id="seconds">00</div>

                <div class="label">SECONDS</div>

            </div>

        </div>

    </div>

</div>

<!-- FULLSCREEN BUTTON -->

<button id="fullscreen-btn" onclick="toggleFullscreen()">

    FULLSCREEN ⚡

</button>

<script>

/* COUNTDOWN */

const targetDate =
new Date("2027-01-22T00:00:00").getTime();

function updateCountdown(){

    const now = new Date().getTime();

    const distance = targetDate - now;

    const days =
    Math.floor(distance / (1000*60*60*24));

    const hours =
    Math.floor((distance % (1000*60*60*24))
    / (1000*60*60));

    const minutes =
    Math.floor((distance % (1000*60*60))
    / (1000*60));

    const seconds =
    Math.floor((distance % (1000*60))
    / 1000);

    document.getElementById("days").innerText = days;
    document.getElementById("hours").innerText = hours;
    document.getElementById("minutes").innerText = minutes;
    document.getElementById("seconds").innerText = seconds;
}

setInterval(updateCountdown,1000);

updateCountdown();

/* FULLSCREEN */

function toggleFullscreen(){

    if(!document.fullscreenElement){

        document.documentElement.requestFullscreen();

    }else{

        document.exitFullscreen();
    }
}

</script>

</body>

</html>
